<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#163453}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#52677c}.arrow{fill:none;stroke:#52677c;stroke-width:2;marker-end:url(#arrow)} </style>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<text x="38" y="46" class="title" text-anchor="start">JEV-CachePlan · Noul 退款意图决策</text><text x="38" y="75" class="small" text-anchor="start">系统示意 | 相同完整记录、固定问题和模型；标签独立保留用于评估</text><rect x="36" y="110" width="260" height="125" rx="12" fill="#edf4fa" stroke="#bfd1e0"/><text x="166.0" y="144" class="label" text-anchor="middle">结构化记录</text><text x="166.0" y="178" class="small" text-anchor="middle">128 × 10 合成负载</text><text x="166.0" y="206" class="small" text-anchor="middle">原位置与 ID 校验</text><rect x="336" y="110" width="260" height="125" rx="12" fill="#edf4fa" stroke="#bfd1e0"/><text x="466.0" y="144" class="label" text-anchor="middle">布局计划</text><text x="466.0" y="178" class="small" text-anchor="middle">Original / CachePlan</text><text x="466.0" y="206" class="small" text-anchor="middle">复用已有行列规划器</text><rect x="636" y="110" width="260" height="125" rx="12" fill="#edf4fa" stroke="#bfd1e0"/><text x="766.0" y="144" class="label" text-anchor="middle">序列化与批量请求</text><text x="766.0" y="178" class="small" text-anchor="middle">完整字段与固定问题</text><text x="766.0" y="206" class="small" text-anchor="middle">4 个在途请求（基准）</text><rect x="936" y="110" width="260" height="125" rx="12" fill="#edf4fa" stroke="#bfd1e0"/><text x="1066.0" y="144" class="label" text-anchor="middle">vLLM + JEV-9B</text><text x="1066.0" y="178" class="small" text-anchor="middle">决策 LoRA / BF16</text><text x="1066.0" y="206" class="small" text-anchor="middle">APC 前缀缓存</text><rect x="936" y="295" width="260" height="125" rx="12" fill="#e8f7f2" stroke="#bfd1e0"/><text x="1066.0" y="329" class="label" text-anchor="middle">Noul 概率解析</text><text x="1066.0" y="363" class="small" text-anchor="middle">单 Token 候选 logprobs</text><text x="1066.0" y="391" class="small" text-anchor="middle">固定 bias / 温度校准</text><rect x="636" y="295" width="260" height="125" rx="12" fill="#e8f7f2" stroke="#bfd1e0"/><text x="766.0" y="329" class="label" text-anchor="middle">按计划位置恢复</text><text x="766.0" y="363" class="small" text-anchor="middle">概率矩阵、标签和 ID</text><text x="766.0" y="391" class="small" text-anchor="middle">LayoutPlan.restore</text><rect x="336" y="295" width="260" height="125" rx="12" fill="#e8f7f2" stroke="#bfd1e0"/><text x="466.0" y="329" class="label" text-anchor="middle">真实指标核验</text><text x="466.0" y="363" class="small" text-anchor="middle">usage ↔ /metrics</text><text x="466.0" y="391" class="small" text-anchor="middle">耗时、吞吐与延迟</text><rect x="36" y="295" width="260" height="125" rx="12" fill="#e8f7f2" stroke="#bfd1e0"/><text x="166.0" y="329" class="label" text-anchor="middle">独立运行产物</text><text x="166.0" y="363" class="small" text-anchor="middle">run_id / 配置 / 结果</text><text x="166.0" y="391" class="small" text-anchor="middle">保留全部正式测量</text><path d="M296,173 L333,173" class="arrow"/><path d="M596,173 L633,173" class="arrow"/><path d="M896,173 L933,173" class="arrow"/><path d="M1066,235 L1066,291" class="arrow"/><path d="M936,358 L899,358" class="arrow"/><path d="M636,358 L599,358" class="arrow"/><path d="M336,358 L299,358" class="arrow"/><text x="38" y="465" class="small" text-anchor="start">本项目侧重系统集成、适配与实测；示意图不包含虚构概率，底层方法与许可见技术来源。</text>
</svg>
